<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Microsoft To Do 导出</title>
    <link rel="stylesheet" href="panel.css">
    <script type="module" src="panel.js"></script>
  </head>
  <body>
    <main>
      <header>
        <p class="eyebrow">Microsoft To Do</p>
        <h1>导出任务</h1>
        <p>读取当前账号的普通清单、已完成任务、备注和子步骤。</p>
      </header>
      <section aria-labelledby="status-title">
        <h2 id="status-title">读取状态</h2>
        <p id="status" role="status" aria-live="polite">准备就绪</p>
        <progress id="progress" aria-label="清单读取进度" hidden></progress>
        <div class="actions">
          <button id="start" type="button">读取全部清单</button>
          <button id="cancel" class="secondary" type="button" hidden>取消读取</button>
        </div>
      </section>
      <section id="downloads" aria-labelledby="download-title" hidden>
        <h2 id="download-title">保存到本地</h2>
        <div class="actions">
          <button id="csv" class="secondary" type="button">下载 CSV</button>
          <button id="json" class="secondary" type="button">下载 JSON</button>
        </div>
        <p id="download-status" role="status" aria-live="polite"></p>
      </section>
      <p class="hint">读取时请保留侧栏及扩展打开的 To Do 标签页。任务数据只在浏览器内处理。</p>
    </main>
  </body>
</html>
