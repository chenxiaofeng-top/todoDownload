<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Microsoft To Do 导出</title>
    <link rel="stylesheet" href="panel.css">
    <script type="module" src="panel.js"></script>
  </head>
  <body>
    <main>
      <header>
        <p class="eyebrow">Microsoft To Do</p>
        <h1>导出任务</h1>
        <p>导出当前账号的任务、备注和子步骤。</p>
      </header>
      <section aria-labelledby="settings-title">
        <h2 id="settings-title">读取设置</h2>
        <div class="settings">
          <label for="scope">任务范围</label>
          <select id="scope">
            <option value="all">全部任务</option>
            <option value="open">仅未完成</option>
            <option value="completed">仅已完成</option>
          </select>
          <label for="interval">读取动作间隔（毫秒）</label>
          <input id="interval" type="number" min="0" max="10000" step="1" value="1000" required aria-describedby="interval-hint">
          <p id="interval-hint" class="hint">设为 0 可快速读取，或输入 250–10000 毫秒以减少短时间内连续发出的请求。</p>
        </div>
      </section>
      <section aria-labelledby="status-title">
        <h2 id="status-title">读取状态</h2>
        <p id="status" role="status" aria-live="polite">准备就绪</p>
        <progress id="progress" aria-label="清单读取进度" hidden></progress>
        <div class="actions">
          <button id="start" type="button">读取任务</button>
          <button id="cancel" class="secondary" type="button" hidden>取消读取</button>
        </div>
      </section>
      <section id="downloads" aria-labelledby="download-title" hidden>
        <h2 id="download-title">保存到本地</h2>
        <div class="actions">
          <button id="csv" class="secondary" type="button">下载 CSV</button>
          <button id="json" class="secondary" type="button">下载 JSON</button>
        </div>
        <p id="download-status" role="status" aria-live="polite"></p>
      </section>
      <section aria-labelledby="diagnostic-title">
        <h2 id="diagnostic-title">导出诊断</h2>
        <p class="hint">近期导出日志保存在当前浏览器中。遇到异常后，可下载日志排查。</p>
        <div class="actions">
          <button id="download-diagnostics" class="secondary" type="button">下载诊断日志</button>
        </div>
        <p id="diagnostic-warning" class="hint" role="status" hidden>部分诊断日志未能保存，报告可能不完整。</p>
        <p id="diagnostic-status" class="hint" role="status"></p>
      </section>
      <p class="hint">读取时请保留侧栏及扩展打开的 To Do 标签页。任务数据只在浏览器内处理。</p>
    </main>
  </body>
</html>
